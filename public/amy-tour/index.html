<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Amy Grant — Tour · studio.boerhaus.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;600&display=swap" rel="stylesheet" />
<style>body{font-family:Asap,system-ui,sans-serif;background:#f3ebe0;color:#442A13;padding:24px;margin:0}a{color:#442A13}</style>
</head>
<body>
<p>Loading Amy Grant tour demo…</p>
<p style="font-size:13px;color:#7a6550">Canonical: <a href="https://studio.boerhaus.com/amy-tour/">studio.boerhaus.com/amy-tour</a></p>
<script>
(async function () {
  try {
    var t = Date.now();
    var parts = await Promise.all([0,1,2].map(function (i) {
      return fetch("/lab/amy-tour/page.b64gz.part" + i + ".txt?t=" + t).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      });
    }));
    var b64 = parts.join("").replace(/\s+/g, "");
    var bin = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
    var ds = new DecompressionStream("gzip");
    var stream = new Blob([bin]).stream().pipeThrough(ds);
    var html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    try {
      var b64 = await fetch("/lab/amy-tour/page.b64gz.txt?t=" + Date.now()).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); });
      var bin = Uint8Array.from(atob(b64.trim()), function (c) { return c.charCodeAt(0); });
      var ds = new DecompressionStream("gzip");
      var stream = new Blob([bin]).stream().pipeThrough(ds);
      var html = await new Response(stream).text();
      document.open(); document.write(html); document.close();
    } catch (err2) {
      document.body.innerHTML = "<p style=\"color:#8a2f2f\">Could not load demo (" + err2 + ").</p><p><a href=\"https://studio.boerhaus.com/amy-tour/\">Open on studio.boerhaus.com</a></p>";
    }
  }
})();
</script>
</body>
</html>
