<style>

  .ta-tour__head {

  .ta-tour__ico {
    width: 20px; height: 20px; display: block;

  .ta-tour__brand {
    font-size: 13px; letter-spacing: 0.08em;
    text-transform: uppercase; margin: 0; line-height: 1;

  .ta-tour__metrics {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px;
  }
  .ta-tour__metric-label {

    text-transform: uppercase; color: var(--ta-muted);
    margin: 0 0 2px; line-height: 1.2;
  }
  .ta-tour__metric-value {
    display: block; font-family: Georgia, "Times New Roman", serif;
    font-size: 28px; line-height: 1.05; letter-spacing: -0.02em; margin: 0;
  }
  .ta-tour__list {
    list-style: none; margin: 0; padding: 0;
    border-top: 1px solid var(--ta-line);
  }
  .ta-tour__row {
    display: grid;
    grid-template-columns: 5.5rem minmax(0, 1.05fr) minmax(0, 1.35fr);
    gap: 10px 14px;
    align-items: start;
    padding: 14px 4px;
    border-bottom: 1px solid var(--ta-line);
  }
  @media (max-width: 560px) {
    .ta-tour__row {
      grid-template-columns: 4.5rem minmax(0, 1fr);
      grid-template-areas:
        "date city"
        "date venue";
      gap: 2px 12px;
      padding: 12px 4px;
    }
    .ta-tour__date { grid-area: date; padding-top: 4px; }
    .ta-tour__city { grid-area: city; }
    .ta-tour__venue { grid-area: venue; }
  }
  .ta-tour__date {
    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    text-decoration: underline; text-underline-offset: 3px;
    text-decoration-thickness: 1px; white-space: nowrap; padding-top: 3px;
  }
  .ta-tour__date:hover { color: var(--ta-navy); }
  .ta-tour__city {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 20px; line-height: 1.15; letter-spacing: -0.01em;
    margin: 0; min-width: 0;

  .ta-tour__venue { margin: 0; min-width: 0; }
  .ta-tour__building {
    display: block;
    font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;

  .ta-tour__tour {
    display: block;
    font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ta-muted); line-height: 1.35; margin-top: 2px;
  }
  .ta-tour__status {
    font-size: 11px; color: var(--ta-muted);
    padding: 10px 4px; margin: 0;
  }
</style>
