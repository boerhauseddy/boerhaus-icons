  .tmt {

  .tmt :is(p, h2, h3, span, a, button) { color: inherit; }
  .tmt a { text-decoration: none; }
  .tmt :is(p, h2, h3) { margin: 0; padding: 0; }

  /* Section header — same as tobymac.com "TOUR DATES" h2.section-header */
  .tmt__title {
    font-size: 24px; font-weight: 700; letter-spacing: 1.6px; line-height: 36px;
    text-transform: uppercase; text-align: center; margin: 0 0 28px;
  }

  /* Stat boxes */
  .tmt__stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 0 0 32px; }
  .tmt__stat {
    display: block; background: var(--tmt-paper);
    border: 3px solid var(--tmt-ink); border-radius: var(--tmt-radius);
    padding: 18px 20px 16px; min-width: 0;
  }
  a.tmt__stat:hover { background: var(--tmt-cream); }
  .tmt__stat-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; margin: 0 0 10px;
  }
  .tmt__stat-label img { width: 16px; height: 16px; display: block; }
  .tmt__stat-value { display: block; font-size: 40px; font-weight: 900; line-height: 1; letter-spacing: -0.02em; }
  .tmt__stat-value--sm { font-size: 24px; line-height: 1.15; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tmt__stat-note { display: block; font-size: 12px; font-weight: 500; letter-spacing: 0.64px; text-transform: uppercase; margin: 8px 0 0; opacity: 0.7; }

  /* Tour blocks — each a full themed card */
  .tmt__blocks { display: grid; gap: 24px; }
  .tmt__block {
    --b-bg: var(--tmt-paper); --b-ink: var(--tmt-ink); --b-accent: var(--tmt-coral);
    --b-line: rgba(0, 0, 0, 0.14); --b-muted: rgba(0, 0, 0, 0.62);
    background: var(--b-bg); color: var(--b-ink);
    border-radius: var(--tmt-radius); padding: 36px 40px 28px;
  }
  .tmt__block--charcoal { --b-bg: var(--tmt-charcoal); --b-ink: #ffffff; --b-accent: var(--tmt-coral); --b-line: rgba(255,255,255,0.16); --b-muted: rgba(255,255,255,0.66); }
  .tmt__block--coral    { --b-bg: var(--tmt-coral); --b-ink: #000000; --b-accent: #ffffff; --b-line: rgba(0,0,0,0.18); --b-muted: rgba(0,0,0,0.72); }
  .tmt__block--cream    { --b-bg: var(--tmt-cream); --b-ink: #000000; --b-accent: var(--tmt-coral); --b-line: rgba(0,0,0,0.12); --b-muted: rgba(0,0,0,0.6); }

  .tmt__block-head { margin: 0 0 18px; }
  .tmt .tmt__kicker { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--b-accent); margin: 0 0 8px; }
  .tmt .tmt__block--coral .tmt__kicker { color: var(--b-ink); }

  .tmt__guests { font-size: 20px; font-weight: 500; letter-spacing: 0.4px; line-height: 1.35; margin: 8px 0 0; }
  .tmt .tmt__range { font-size: 13px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: var(--b-muted); margin: 10px 0 0; }

  /* Rows: CITY (biggest) · DATE · VENUE · TICKETS */
  .tmt__rows { border-top: 1px solid var(--b-line); }
  .tmt__row {
    display: grid; grid-template-columns: minmax(0, 1.25fr) 9.5rem minmax(0, 1.25fr) auto;
    gap: 6px 24px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--b-line);

    color: inherit; font: inherit; font-size: 14px; font-weight: 900; letter-spacing: 1.2px; text-transform: uppercase; cursor: pointer;
  }
  .tmt .tmt__more:hover { background: var(--b-ink); color: var(--b-bg); }
  .tmt__status { font-size: 14px; padding: 16px 0; text-align: center; }
  .tmt .tmt__status--err { color: #b3261e; }
  .tmt__source { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; text-align: center; opacity: 0.55; margin: 20px 0 0; }

  @media (max-width: 900px) {
    .tmt__stats { grid-template-columns: 1fr 1fr; }
    .tmt__stat--next { grid-column: 1 / -1; }
    .tmt__row { grid-template-columns: minmax(0, 1fr) 8.5rem minmax(0, 1fr) auto; gap: 6px 16px; }
    .tmt__city { font-size: 20px; }
  }
  /* Mobile: stacked CITY → DATE → VENUE, ticket icon button on the right */
  @media (max-width: 600px) {
    .tmt__title { margin-bottom: 18px; }
    .tmt__stats { gap: 10px; margin-bottom: 20px; }
    .tmt__stat { padding: 14px 14px 12px; }
    .tmt__stat-value { font-size: 30px; }
    .tmt__stat-value--sm { font-size: 20px; }
    .tmt__blocks { gap: 16px; }
    .tmt__block { padding: 24px 18px 18px; border-radius: 8px; }
    .tmt__name { font-size: 26px; letter-spacing: 1px; }
    .tmt__guests { font-size: 16px; }
    .tmt .tmt__range { font-size: 12px; }
    .tmt__row {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "city btn" "date btn" "venue btn";
      gap: 3px 14px; padding: 14px 0;
    }
    .tmt__city { grid-area: city; font-size: 21px; }
    .tmt__date { grid-area: date; font-size: 13px; }
    .tmt .tmt__venue { grid-area: venue; font-size: 12px; white-space: normal; }
    .tmt__btn { grid-area: btn; min-width: 0; width: 48px; height: 48px; padding: 0; }
    .tmt__btn-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .tmt__ico { width: 22px; height: 22px; }
  }
</style>

<div class="tmt" data-artist="TobyMac" data-app-id="js_www" data-bit-url="https://www.bandsintown.com/a/817-tobymac">
  <h2 class="tmt__title">Tour Dates</h2>
  <div class="tmt__stats">
    <a class="tmt__stat" href="https://www.bandsintown.com/a/817-tobymac" target="_blank" rel="noopener">
      <span class="tmt__stat-label"><img src="https://icons.boerhaus.com/bandsintown.svg" alt="" width="16" height="16" />Bandsintown followers</span>
      <span class="tmt__stat-value" data-tmt="followers">—</span>
      <span class="tmt__stat-note">Track TobyMac</span>
    </a>
    <div class="tmt__stat">
      <span class="tmt__stat-label"><span class="tmt__ico" aria-hidden="true"></span>Concerts on sale</span>
      <span class="tmt__stat-value" data-tmt="count">—</span>
      <span class="tmt__stat-note" data-tmt="tours">&nbsp;</span>
    </div>
    <div class="tmt__stat tmt__stat--next">
      <span class="tmt__stat-label">Next show</span>
      <span class="tmt__stat-value tmt__stat-value--sm" data-tmt="next-city">—</span>
      <span class="tmt__stat-note" data-tmt="next-date">&nbsp;</span>
    </div>
  </div>
  <div class="tmt__blocks" data-tmt="list" aria-live="polite">
    <p class="tmt__status">Loading dates…</p>
  </div>
  <p class="tmt__source">Dates live from Bandsintown</p>
</div>

<script>
(function () {
  /* ── Tour rules: first match wins. Matched against event title, then description (case-insensitive).
       label: block header ("{year}" = year of the block's first date)
       guests: subhead shown once in the header, never per event
       theme: charcoal | coral | cream | plain
       limit: rows shown before "See all N dates" (null = show all)
       NOTE: Bandsintown titles the spring run "Hit's Deep 2027" (stray apostrophe). We match both
       spellings and display the corrected label "Hits Deep {year}" from this config. ── */
  var TMT_RULES = [
    { id: "fall",     match: { description: /three names\.?\s*one tour|chris\s+tomlin.*third\s+day/i },
      kicker: "Three names. One tour.", label: "Fall Tour {year}", guests: "with Chris Tomlin & Third Day",
      theme: "charcoal", limit: null },
    { id: "hitsdeep", match: { title: /hit'?s\s*deep/i, description: /hits\s*deep\s*tour/i },
      kicker: "TobyMac’s", label: "Hits Deep {year}", guests: "with Jeremy Camp, Seph Schlueter & Katy Nichole",
      theme: "coral", limit: 8 }
  ];
  var TMT_FALLBACK = { id: "more", kicker: "", label: "More dates", guests: "", theme: "cream", limit: 8 };

  /* Venue-name overrides by Bandsintown event id (reused from the True Artist TobyMac block).
     Needed because BIT stores the venue name as "Hit's Deep 2027" on the spring run. */
  var TMT_VENUES = {"108836301":"Crown Complex","108836308":"Rupp Arena","108836321":"Von Braun Center","108836309":"Cajundome & Convention Center","108836313":"Benchmark International Arena","108836294":"Amerant Bank Arena","108836300":"Kia Center","108836297":"Hertz Arena","108836303":"Pensacola Bay Center","108836305":"Smart Financial Centre at Sugar Land","108836314":"Texas Trust CU Theatre","108836304":"Nationwide Arena","108836319":"EagleBank Arena","108836293":"EagleBank Arena","108836302":"Chartway Arena at the Ted Constant Convocation Center","108836298":"VyStar Veterans Memorial Arena","108836306":"Bridgestone Arena","108836316":"Gas South Convention Center","108836295":"Thompson-Boling Arena","108836322":"Huntington Center","108836310":"Fishers Event Center","108836299":"Show Me Center","108836317":"Van Andel Arena","108836318":"Moody Center","108836296":"Freeman Coliseum","108836320":"United Supermarkets Arena","108836312":"Denny Sanford PREMIER Center","108836311":"Fargodome","108836307":"BMO Center","108836323":"Chaifetz Arena","108836315":"BOK Center","108368752":"GIANT Center","108368753":"KeyBank Center","108368754":"First Horizon Coliseum","108368755":"Casey's Center","108368756":"Ford Center","108368757":"CFG Bank Arena","108368758":"Pinnacle Bank Arena","108368759":"Wolstein Center","108368760":"Mizzou Arena","108368761":"Cross Insurance Arena","108368762":"Peoria Civic Center","108368763":"Simmons Bank Arena"};

  var scripts = document.getElementsByTagName("script");
  var me = document.currentScript || scripts[scripts.length - 1];
  var root = me && me.previousElementSibling;
  if (!root || !root.classList || !root.classList.contains("tmt")) root = document.querySelector(".tmt");
  if (!root) return;

  var artist = root.getAttribute("data-artist") || "TobyMac";
  var appId = root.getAttribute("data-app-id") || "js_www";
  var listEl = root.querySelector('[data-tmt="list"]');
  var MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  var DOW = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
  var expanded = {};

  function $(k) { return root.querySelector('[data-tmt="' + k + '"]'); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function parts(iso) { var m = String(iso || "").match(/(\d{4})-(\d{2})-(\d{2})/); return m ? { y: +m[1], m: +m[2], d: +m[3] } : null; }
  function md(p) { return p ? MONTHS[p.m - 1] + " " + p.d : ""; }
  function dow(p) { return p ? DOW[new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay()] : ""; }
  function fmtCount(n) { n = Number(n) || 0; if (n >= 1e6) return (Math.round(n / 1e5) / 10).toFixed(1).replace(/\.0$/, "") + "M"; if (n >= 1e3) return Math.round(n / 1e3) + "K"; return String(n); }
  function city(v) { v = v || {}; if (v.city && v.region) return v.city + ", " + v.region; if (v.city && v.country) return v.city + ", " + v.country; return v.location || v.city || ""; }

  function venueName(ev) {
    var id = String(ev.id || "");
    if (TMT_VENUES[id]) return TMT_VENUES[id];
    var n = String((ev.venue && ev.venue.name) || "").trim();
    var t = String(ev.title || "").trim();
    if (!n || (t && n.toLowerCase() === t.toLowerCase()) || /hit'?s?\s*deep|\btour\b/i.test(n)) return "";
    return n;
  }
  function ticket(ev) {
    var o = ev.offers || [], i;
    for (i = 0; i < o.length; i++) if (o[i].type === "Tickets" && o[i].url) return { url: o[i].url, status: o[i].status };
    for (i = 0; i < o.length; i++) if (o[i].url) return { url: o[i].url, status: o[i].status };
    return { url: ev.url || "", status: "" };
  }
  function ruleFor(ev) {
    var t = String(ev.title || ""), d = String(ev.description || "");
    for (var i = 0; i < TMT_RULES.length; i++) {
      var m = TMT_RULES[i].match;
      if ((m.title && t && m.title.test(t)) || (m.description && d && m.description.test(d))) return TMT_RULES[i];
    }
    return TMT_FALLBACK;
  }
  function group(events) {
    var map = {}, out = [];
    events.forEach(function (ev) {
      var r = ruleFor(ev);
      if (!map[r.id]) { map[r.id] = { rule: r, events: [] }; out.push(map[r.id]); }
      map[r.id].events.push(ev);
    });
    out.forEach(function (g) { g.events.sort(function (a, b) { return String(a.datetime).localeCompare(String(b.datetime)); }); });
    out.sort(function (a, b) { return String(a.events[0].datetime).localeCompare(String(b.events[0].datetime)); });
    return out;
  }
  function fill(s, g) { var p = parts(g.events[0].datetime); return String(s || "").replace("{year}", p ? p.y : ""); }

  function rowHtml(ev) {
    var p = parts(ev.datetime || ev.starts_at), v = venueName(ev), tk = ticket(ev);
    var sold = /sold/i.test(tk.status || "");
    var label = sold ? "Sold out" : "Tickets";
    var btn = tk.url
      ? '<a class="tmt__btn' + (sold ? " tmt__btn--off" : "") + '" href="' + esc(tk.url) + '" target="_blank" rel="noopener" aria-label="' + label + " — " + esc(city(ev.venue)) + " " + md(p) + '"><span class="tmt__ico" aria-hidden="true"></span><span class="tmt__btn-label">' + label + "</span></a>"
      : "<span></span>";
    return '<div class="tmt__row">' +
      '<p class="tmt__city">' + esc(city(ev.venue)) + "</p>" +
      '<p class="tmt__date"><span class="tmt__dow">' + dow(p) + "</span>" + md(p) + "</p>" +
      '<p class="tmt__venue">' + esc(v || "—") + "</p>" + btn + "</div>";
  }

  function render(events) {
    var groups = group(events);
    listEl.innerHTML = "";
    if (!events.length) { listEl.innerHTML = '<p class="tmt__status">No upcoming dates right now — check back soon.</p>'; return; }
    groups.forEach(function (g) {
      var r = g.rule, n = g.events.length;
      var first = parts(g.events[0].datetime), last = parts(g.events[n - 1].datetime);
      var range = md(first) + (n > 1 && md(last) !== md(first) ? " – " + md(last) : "") + " · " + n + (n === 1 ? " date" : " dates");
      var limit = r.limit && !expanded[r.id] ? r.limit : n;
      var sec = document.createElement("section");
      sec.className = "tmt__block tmt__block--" + (r.theme || "plain");
      sec.setAttribute("data-tour", r.id);
      sec.innerHTML =
        '<header class="tmt__block-head">' +
          (r.kicker ? '<p class="tmt__kicker">' + esc(fill(r.kicker, g)) + "</p>" : "") +
          '<h3 class="tmt__name">' + esc(fill(r.label, g)) + "</h3>" +
          (r.guests ? '<p class="tmt__guests">' + esc(r.guests) + "</p>" : "") +
          '<p class="tmt__range">' + range + "</p>" +
        "</header>" +
        '<div class="tmt__rows">' + g.events.slice(0, limit).map(rowHtml).join("") + "</div>";
      if (r.limit && n > r.limit) {
        var b = document.createElement("button");
        b.type = "button"; b.className = "tmt__more";
        b.setAttribute("aria-expanded", expanded[r.id] ? "true" : "false");
        b.textContent = expanded[r.id] ? "Show fewer dates" : "See all " + n + " dates";
        b.addEventListener("click", function () { expanded[r.id] = !expanded[r.id]; render(events); if (!expanded[r.id]) sec.scrollIntoView({ block: "start" }); });
        sec.appendChild(b);
      }
      listEl.appendChild(sec);
    });
    $("count").textContent = String(events.length);
    $("tours").textContent = groups.length + (groups.length === 1 ? " tour block" : " tour blocks");
    var p0 = parts(events[0].datetime);
    $("next-city").textContent = city(events[0].venue);
    $("next-date").textContent = dow(p0) + " " + md(p0) + (venueName(events[0]) ? " · " + venueName(events[0]) : "");
  }

  var base = "https://rest.bandsintown.com/artists/" + encodeURIComponent(artist), q = "?app_id=" + encodeURIComponent(appId);
  fetch(base + q).then(function (r) { return r.ok ? r.json() : null; }).then(function (a) {
    if (a && a.tracker_count != null) $("followers").textContent = fmtCount(a.tracker_count);
  }).catch(function () {});
  fetch(base + "/events" + q).then(function (r) { if (!r.ok) throw new Error("events " + r.status); return r.json(); })
    .then(function (ev) { ev = Array.isArray(ev) ? ev.slice() : []; ev.sort(function (a, b) { return String(a.datetime).localeCompare(String(b.datetime)); }); render(ev); })
    .catch(function (e) { listEl.innerHTML = '<p class="tmt__status tmt__status--err">Couldn’t load tour dates. Try again in a moment.</p>'; if (window.console) console.warn("tmt", e); });
})();
</script>
