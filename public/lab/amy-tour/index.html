<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Amy Grant — Tour demo · Boerhaus lab</title>
</head>
<body style="font-family:Courier,monospace;background:#f4efe6;color:#1a1714;padding:24px">
<p>Loading Amy Grant tour demo…</p>
<script>
(function(){
  var base = "https://cdn.jsdelivr.net/gh/boerhauseddy/boerhaus-icons@main/public/lab/amy-tour/";
  var t = "?t=" + Date.now();
  Promise.all([0,1,2].map(function(i){
    return fetch(base + "part" + i + ".txt" + t).then(function(r){
      if(!r.ok) throw new Error("part" + i + " " + r.status);
      return r.text();
    });
  })).then(function(parts){
    document.open();
    document.write(parts.join(""));
    document.close();
  }).catch(function(err){
    document.body.innerHTML = "<p style=\"color:#8a2f2f\">Could not assemble demo.</p><pre>" + err + "</pre><p>Open <code>/workspace/amy-grant-tour-demo/index.html</code> locally, or paste <code>ta-amy-grant-bandsintown.txt</code> into a Squarespace code block.</p>";
  });
})();
</script>
</body>
</html>
