<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Amy Grant — Tour demo · Boerhaus lab</title>
</head>
<body style="font-family:Courier,monospace;background:#f4efe6;color:#1a1714;padding:24px">
<p>Loading Amy Grant tour demo…</p>
<script>
(async function () {
  try {
    var url = "page.b64gz.txt?t=" + Date.now();
    var b64 = await fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); });
    var bin = Uint8Array.from(atob(b64.trim()), function (c) { return c.charCodeAt(0); });
    var ds = new DecompressionStream("gzip");
    var stream = new Blob([bin]).stream().pipeThrough(ds);
    var html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    document.body.innerHTML = "<p style=\"color:#8a2f2f\">Could not load demo (" + err + ").</p><p>Local fallback: open <code>/workspace/amy-grant-tour-demo/index.html</code>.</p>";
  }
})();
</script>
</body>
</html>
